name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Тесты разбора
        run: gradle :plugin-tiktok:test --console=plain --no-daemon

      # Страховка от повторения: в классах плагина не должно остаться invokedynamic —
      # на Android нет его служебных классов, а d8 запускается без десугаринга.
      - name: Нет invokedynamic в классах плагина
        run: |
          DIR=plugin-tiktok/build/classes/kotlin/main
          test -d "$DIR" || { echo "нет $DIR" >&2; exit 1; }
          if find "$DIR" -name '*.class' -print0 | xargs -0 javap -c -p | grep -q invokedynamic; then
            echo "в классах плагина есть invokedynamic: на Android он не работает" >&2
            find "$DIR" -name '*.class' -print0 | xargs -0 javap -c -p | grep -B30 invokedynamic | grep -E "^(public|final|class|  [a-z].*\()" | head -20 >&2
            exit 1
          fi
          echo "invokedynamic не найден"

      - name: Проверка ключа подписи
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "нет секрета PLUGIN_SIGNING_KEY — подписать нечем" >&2
            exit 1
          fi

      - name: Сборка, dex, подпись
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PLUGIN_VERSION: ${{ github.run_number }}
          PLUGIN_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/provider-tiktok.jar
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          mkdir -p tools
          printf '%s' "$PLUGIN_SIGNING_KEY" > tools/plugin-signing-key.pem
          chmod 600 tools/plugin-signing-key.pem
          bash ./tools/build-plugin.sh
          rm -f tools/plugin-signing-key.pem

      # Основной адрес манифеста — ассет релиза: у latest/download/sources.json
      # постоянный URL, и он всегда указывает на последнюю версию.
      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/provider-tiktok.jar
            dist/sources.json

      # Зеркало в ветке — второй адрес в клиентском MIRRORS. Нужно ровно для
      # первого запуска: пока релиза нет, latest/download отвечает 404, а
      # sources.json в main уже лежит. Подписать манифест может только CI
      # (ключ в Secrets), поэтому в ветку его кладёт CI, а не человек.
      # Пуш в main перезапустит этот workflow, но уже без тега — шаг пропустится.
      - name: Зеркало манифеста в main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # В checkout по тегу локальной ветки main нет — создаём её от origin/main.
          git checkout -B main origin/main
          cp dist/sources.json sources.json
          git add sources.json
          if git diff --cached --quiet; then
            echo "манифест не изменился"
            exit 0
          fi
          git commit -m "sources.json: ${GITHUB_REF_NAME}"
          git push origin main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin
          path: dist/
          if-no-files-found: ignore
